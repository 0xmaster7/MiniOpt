name: verify
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizers: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
